services:
  web:
    build: .
    container_name: node-app
    ports:
      - "3001:3000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/myappdb
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app-network

  mongo:
    image: mongo:7
    container_name: mongo-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge
